name: Release

# Fires on a version tag (e.g. "v0.1.0") - never on an ordinary push, so
# this workflow existing changes nothing about day-to-day CI (go.yml/
# dotnet.yml still gate every push/PR the same way they always have).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-installer:
    # Separate job, not a goreleaser step - goreleaser has no first-party
    # .NET build support, and the installer (installer/build.ps1) needs a
    # real Windows runner for ISCC.exe anyway. Depends on goreleaser so
    # the release (and its Go binaries) already exists before this
    # uploads the installer onto it.
    runs-on: windows-latest
    needs: goreleaser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          installer\build.ps1 -Version $version
      - name: Upload installer to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" installer\Output\GoTorrentSetup.exe --clobber
