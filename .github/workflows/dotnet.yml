name: .NET Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore GoTorrent.sln

    - name: Check formatting
      run: dotnet format GoTorrent.sln --verify-no-changes

    - name: Build
      run: dotnet build GoTorrent.sln --no-restore --configuration Release

    - name: Test
      run: >
        dotnet test GoTorrent.sln --no-build --configuration Release
        --collect:"XPlat Code Coverage" --results-directory ./coverage

    - name: Generate coverage report
      run: |
        dotnet tool install -g dotnet-reportgenerator-globaltool
        reportgenerator -reports:"coverage/**/coverage.cobertura.xml" -targetdir:coveragereport -reporttypes:"Html;TextSummary"
        {
          echo "### .NET coverage"
          echo '```'
          cat coveragereport/Summary.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: dotnet-coverage
        path: coveragereport
