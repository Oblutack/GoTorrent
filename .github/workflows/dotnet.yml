name: .NET Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore GoTorrent.sln

    - name: Check formatting
      run: dotnet format GoTorrent.sln --verify-no-changes

    - name: Build
      run: dotnet build GoTorrent.sln --no-restore --configuration Release

    - name: Test
      run: dotnet test GoTorrent.sln --no-build --configuration Release
